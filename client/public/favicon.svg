  <path d="M41 30.5H46C47 30.5 48 31.5 48.5 32.5L50 35.5H41V30.5Z" fill="#93C5FD"/>
  <!-- Headlight Glow -->
  <rect x="51.5" y="38" width="1.5" height="2.5" rx="0.75" fill="#FACC15"/>

  <!-- Chassis Underbody Bar -->
  <rect x="14" y="42" width="36" height="2.5" rx="1" fill="#475569"/>

  <!-- Wheels / Tires -->
  <!-- Rear Trailer Wheel 1 -->
  <circle cx="18" cy="44.5" r="4.5" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="18" cy="44.5" r="1.5" fill="#94A3B8"/>
  <!-- Rear Trailer Wheel 2 -->
  <circle cx="27" cy="44.5" r="4.5" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="27" cy="44.5" r="1.5" fill="#94A3B8"/>
  <!-- Front Cab Wheel -->
  <circle cx="45" cy="44.5" r="4.5" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
