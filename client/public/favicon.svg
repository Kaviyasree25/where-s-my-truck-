  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="2"/>
  
  <!-- Radar Wave Rings -->
  <circle cx="44" cy="18" r="10" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="2 2"/>
  <circle cx="44" cy="18" r="6" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- GPS Beacon Pulse Dot -->
  <circle cx="44" cy="18" r="2.5" fill="#10B981"/>
  <circle cx="44" cy="18" r="1.5" fill="#FFFFFF"/>

  <!-- High-Tech Semi-Truck Silhouette -->
  <!-- Main Trailer Cargo Box -->
  <rect x="12" y="22" width="26" height="20" rx="3" fill="#2563EB"/>
  <!-- Trailer Panel Detail Stripes -->
  <path d="M18 25V39M25 25V39M32 25V39" stroke="#1D4ED8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Truck Cab -->
  <path d="M38 28H46C47.5 28 49 29.5 49.5 31L52 36V42H38V28Z" fill="#3B82F6"/>
